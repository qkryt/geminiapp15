name: Build and Release IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build App
        run: |
          xcodebuild -project GeminiApp.xcodeproj \
                     -scheme GeminiApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GeminiApp.app Payload/
          zip -r GeminiApp.ipa Payload

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v1
        with:
          files: GeminiApp.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: "Gemini iOS v1.0.${{ github.run_number }}"
          body: "Автоматическая сборка клиента Gemini для iOS 15+"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}